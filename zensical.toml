copyright = "Copyright &copy; 2026 billiam & Kyoushitsu B"

repo_url = "https://github.com/biriamu/kyoushitsu-b"
repo_name = "biriamu/kyoushitsu-b"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "General Tips" = [
    "General Tips/Posture.md",
    "General Tips/Positioning.md",
    "General Tips/Practice Strategies.md",
  ] },
  { "Tech and Accessories" = [
    "Tech/Choosing the Right Device.md",
    "Tech/iOS & iPadOS.md",
    "Tech/Android.md",
    "Tech/Accessories.md",
  ] },
  { "General Terminology" = [
    "General Terminology/Notation.md",
    "General Terminology/Rhythms.md",
  ] },
  { "Games" = [
      { "Project SEKAI" = [
        "Games/Project SEKAI/About.md",
        "Games/Project SEKAI/Mechanics.md",
        "Games/Project SEKAI/Terms.md",
              { "Guides" = [
                "Games/Project SEKAI/Guides/Mechanics.md",    
                "Games/Project SEKAI/Guides/Songs.md",
                "Games/Project SEKAI/Guides/Resources.md",    
                "Games/Project SEKAI/Guides/Extra.md",              
              ] },
      ] },
      { "hololive Dreams" = [
        "Games/hololive Dreams/About.md",
        "Games/hololive Dreams/Mechanics.md",
        "Games/hololive Dreams/Terms.md",
              { "Guides" = [
                "Games/hololive Dreams/Guides/Mechanics.md",    
                "Games/hololive Dreams/Guides/Songs.md",
                "Games/hololive Dreams/Guides/Resources.md",    
                "Games/hololive Dreams/Guides/Extra.md",              
              ] },
      ] },
  ] },
  { "Credits" = [
    "about.md",
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
name = "catppuccin"
# variant = "classic"
# custom_dir = "overrides"
favicon = "images/student.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "images/128student.png"

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.font]
text = "LINE Seed JP"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "catppuccin-latte"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "catppuccin-mocha"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"   

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/biriamu/kyoushitsu-b"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://kyoushitsu.biriamu.com"

[project.extra]
generator = false

[project.extra.catppuccin]
signature = false

[project.extra.analytics]
provider = "google"
property = "G-M2Q24933W1"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.blocks.caption = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
